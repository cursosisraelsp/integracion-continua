# ==============================================================================
# MI PRIMER AUTOMATISMO EN GITHUB ACTIONS
# ==============================================================================
# Este archivo es la "receta de cocina" que el robot de GitHub leerá y ejecutará.
# Cada vez que guardes cambios y los subas a GitHub, estas instrucciones se activarán.

# NOMBRE DEL FLUJO (Workflow)
# Es el título que verás en la pestaña "Actions" dentro de tu repositorio en GitHub.
name: Mi Primer Automatismo

# ------------------------------------------------------------------------------
# 1. ¿CUÁNDO SE DISPARA ESTE ROBOT? (Eventos / Triggers)
# ------------------------------------------------------------------------------
# 'on' le dice a GitHub qué acción del usuario despierta al robot.
# [push] significa: "Ejecútate CADA VEZ que alguien suba código al repositorio".
on: [push]

# ------------------------------------------------------------------------------
# 2. ¿DÓNDE SE EJECUTA Y QUÉ TAREAS HACE? (Jobs)
# ------------------------------------------------------------------------------
# 'jobs' es la lista de trabajos principales. Aquí creamos un trabajo llamado "saludo".
jobs:
  saludo:
    # 'runs-on' define la máquina virtual que nos presta GitHub en la nube.
    # 'ubuntu-latest' es un ordenador limpio con sistema operativo Linux (Ubuntu).
    runs-on: ubuntu-latest

    # 'steps' es la lista de pasos que la máquina virtual ejecutará EN ORDEN (de arriba a abajo).
    steps:
      
      # PASO 1: Imprimir un mensaje en pantalla
      # 'name' es la etiqueta visible del paso.
      # 'run' es el comando de consola que se ejecuta (echo es como escribir en pantalla).
      - name: Saludar al estudiante
        run: echo "¡Hola! Has subido código correctamente a GitHub 🎉"

      # PASO 2: Consultar la hora de la máquina virtual
      # 'date' es un comando de Linux que le pide al ordenador la fecha y la hora actual.
      - name: Mostrar la fecha del sistema
        run: date